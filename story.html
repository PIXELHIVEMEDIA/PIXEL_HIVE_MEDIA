
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b0a">
<meta name="description" content="Stories and explainers from PixelHive Media.">
<title>Story | PixelHive Media</title>
<style>
:root{--bg:#080b0a;--panel:#101713;--white:#f5f7f4;--muted:#a8b2aa;--red:#ef3340;--green:#1fb56a;--mint:#70e7a7;--gold:#d9b76d;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;line-height:1.75}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{width:min(930px,calc(100% - 36px));margin:auto}
.top-line{height:4px;background:linear-gradient(90deg,var(--bg) 0 18%,var(--red) 18% 38%,var(--white) 38% 58%,var(--green) 58% 82%,var(--gold) 82%)}
header{position:sticky;top:0;z-index:5;background:rgba(8,11,10,.94);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.nav{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-weight:900;letter-spacing:.6px}.brand span{color:var(--mint)}
.links{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.links a:hover,.back:hover{color:var(--mint)}
main{padding:30px 0 65px}
.back{display:inline-block;color:var(--mint);font-size:.84rem;font-weight:900;margin-bottom:25px}
.category{color:var(--mint);font-size:.7rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.08;letter-spacing:-1.6px;margin-bottom:17px;overflow-wrap:anywhere}
.summary{font-size:1.1rem;color:#c2ccc4;line-height:1.65;margin-bottom:22px}
.meta{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:.78rem;padding-bottom:21px;border-bottom:1px solid var(--line);margin-bottom:23px}
.cover{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel);margin-bottom:30px}
.cover img{display:block;width:100%;aspect-ratio:16/9;max-height:540px;object-fit:cover;filter:contrast(1.06) saturate(.94)}
.cover figcaption{padding:9px 13px;color:var(--muted);font-size:.7rem;background:var(--panel)}
.body{max-width:760px;margin:auto;font-size:1.04rem;color:#dce3dd;overflow-wrap:anywhere}
.body p{margin-bottom:22px}
.editor-note{max-width:760px;margin:30px auto;padding:17px 19px;border-left:3px solid var(--gold);background:var(--panel);border-radius:6px;color:var(--muted);font-size:.82rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);color:var(--white);padding:10px 14px;border-radius:7px;font-weight:800;font-size:.82rem}
.btn:hover{border-color:var(--mint)}
.btn-primary{background:var(--green);border-color:var(--green);color:#061009}
.related{border-top:1px solid var(--line);padding-top:28px}
.related h2{font-size:1.5rem;margin-bottom:17px}
.related-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.related-card{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.related-card small{color:var(--mint);text-transform:uppercase;font-weight:900;letter-spacing:1px}
.related-card h3{font-size:1rem;line-height:1.4;margin:8px 0}
.related-card p{font-size:.8rem;color:var(--muted)}
.message{padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:11px;text-align:center}
.message p{color:var(--muted);margin:10px 0 18px}
footer{padding:25px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
footer strong{color:var(--white)}
@media(max-width:580px){.wrap{width:calc(100% - 28px)}.nav{padding:13px 0;align-items:flex-start;flex-direction:column}.links{gap:13px}main{padding-top:22px}h1{letter-spacing:-.8px}.body{font-size:1rem}.related-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top-line"></div>
<header><nav class="wrap nav"><a class="brand" href="./index.html">🐝 PIXEL<span>HIVE</span> MEDIA</a><div class="links"><a href="./index.html">Home</a><a href="./index.html#latest-stories">Latest Stories</a><a href="./all-stories.html">All Stories</a></div></nav></header>
<main class="wrap"><a class="back" href="./all-stories.html">← Back to All Stories</a><div id="content"><div class="message"><h2>Loading your story…</h2><p>Connecting to the Hive library.</p></div></div></main>
<footer><p><strong>🐝 PIXELHIVE MEDIA 🇰🇪</strong></p><p>© <span id="year"></span> PixelHive Media. Stories · Signals · Future.</p></footer>
<script src="./stories.js"></script>
<script src="./scheduled-stories.js"></script>
<script>
(function(){
"use strict";
const root=document.getElementById("content");
document.getElementById("year").textContent=new Date().getFullYear();
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeURL(v){return typeof v==="string"&&/^(https?:\/\/|\.\/|\.\.\/|\/)/i.test(v.trim())?v.trim():""}
function showError(title,detail){root.innerHTML='<div class="message"><h2>'+esc(title)+'</h2><p>'+esc(detail)+'</p><a class="btn btn-primary" href="./all-stories.html">Browse all stories ↗</a></div>'}
const id=new URLSearchParams(location.search).get("id");
const starterStories = Array.isArray(window.PIXELHIVE_STORIES)
  ? window.PIXELHIVE_STORIES : [];

const scheduledStories = Array.isArray(window.PIXELHIVE_SCHEDULED_STORIES)
  ? window.PIXELHIVE_SCHEDULED_STORIES : [];

const storyMap = new Map();

[...starterStories, ...scheduledStories].forEach(story => {
  if (story && story.id) storyMap.set(String(story.id), story);
});

const stories = Array.from(storyMap.values());
if(!id){showError("Choose a story 🐝","Open a story card from the homepage or All Stories.");return}
if(!Array.isArray(stories)){showError("The Hive library could not load","Check that stories.js exists in the repository root.");return}
const s=stories.find(item=>item&&String(item.id)===id);
if(!s){showError("Story not found","This story ID is not in stories.js. Return to the library and choose another story.");return}
document.title=s.title+" | PixelHive Media";
document.querySelector('meta[name="description"]').content=s.summary||s.title;
const image=safeURL(s.coverImage);
const paragraphs=Array.isArray(s.paragraphs)?s.paragraphs:[];
const articleBody=paragraphs.map(p=>typeof p==="string"?"<p>"+esc(p)+"</p>":"").join("");
const related=stories.filter(item=>item.id!==s.id&&item.category===s.category).slice(0,2);
root.innerHTML=
'<div class="category">'+esc((s.emoji?s.emoji+" ":"")+s.category)+'</div>'+
'<article><h1>'+esc(s.title)+'</h1><p class="summary">'+esc(s.summary||"")+'</p>'+
'<div class="meta"><span>📅 '+esc(s.date||"")+'</span><span>🐝 PixelHive Media</span><span>📰 '+esc(s.type||"Story")+'</span></div>'+
(image?'<figure class="cover"><img src="'+esc(image)+'" alt="'+esc(s.imageAlt||s.title)+'"><figcaption>📷 Illustrative editorial image. See the article for the story context.</figcaption></figure>':"")+
'<div class="body">'+articleBody+'</div>'+
(s.editorNote?'<aside class="editor-note"><strong>📝 Editorial note:</strong> '+esc(s.editorNote)+'</aside>':"")+
'<div class="actions"><button class="btn btn-primary" id="share">Share story ↗</button><button class="btn" id="copy">Copy story link</button><a class="btn" href="./all-stories.html">Explore all stories</a></div></article>'+
(related.length?'<section class="related"><h2>More from this desk ✨</h2><div class="related-grid">'+related.map(item=>'<a class="related-card" href="./story.html?id='+encodeURIComponent(item.id)+'"><small>'+esc(item.emoji||"🐝")+' '+esc(item.category)+'</small><h3>'+esc(item.title)+'</h3><p>'+esc(item.summary||"Read more from PixelHive Media.")+'</p></a>').join("")+'</div></section>':"");
document.getElementById("share").addEventListener("click",async()=>{
 try{if(navigator.share){await navigator.share({title:s.title,text:s.summary||s.title,url:location.href})}else{await navigator.clipboard.writeText(location.href);alert("Story link copied!")}}
 catch(e){if(e.name!=="AbortError")prompt("Copy your story link:",location.href)}
});
document.getElementById("copy").addEventListener("click",async()=>{
 try{await navigator.clipboard.writeText(location.href);alert("Story link copied!")}
 catch(e){prompt("Copy your story link:",location.href)}
});
})();
</script>
</body>
</html>
