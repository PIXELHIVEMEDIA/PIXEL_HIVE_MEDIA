
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0a">
  <title>Approved Edition | PixelHive Media</title>
  <style>
    :root {
      --black: #080b0a;
      --surface: #111713;
      --white: #f5f7f4;
      --muted: #a8b2aa;
      --red: #ef3340;
      --green: #1fb56a;
      --gold: #d9b76d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }
    header {
      padding: 24px 18px;
      border-bottom: 1px solid #29332b;
      border-top: 4px solid var(--green);
    }
    .brand { font-weight: 800; font-size: 1.2rem; }
    .brand span { color: var(--red); }
    main { max-width: 850px; margin: auto; padding: 24px 16px; }
    .edition {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: .8rem;
    }
    h1 { line-height: 1.2; font-size: clamp(2rem, 7vw, 3rem); }
    .muted { color: var(--muted); }
    .story {
      background: var(--surface);
      border: 1px solid #29332b;
      border-radius: 14px;
      padding: 18px;
      margin: 18px 0;
    }
    .story h2 { line-height: 1.3; }
    .story img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 10px;
    }
    a { color: #8de4ae; }
    .status {
      padding: 14px;
      border-left: 4px solid var(--gold);
      background: var(--surface);
      border-radius: 6px;
      overflow-wrap: anywhere;
    }
    footer {
      border-top: 1px solid #29332b;
      padding: 24px 16px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">PIXEL<span>HIVE</span> MEDIA 🐝</div>
    <div class="muted">Independent stories. Clear context.</div>
  </header>

  <main>
    <div class="edition">The Signal · Editorial desk</div>
    <h1 id="edition-title">Approved Edition</h1>
    <p id="edition-date" class="muted"></p>
    <div id="message" class="status" role="status">
      Checking the edition...
    </div>
    <section id="stories" aria-live="polite"></section>
    <p><a href="./index.html">← Back to PixelHive Media</a></p>
  </main>

  <footer>
    PixelHive Media · Verify information and consult original sources.
  </footer>

  <script>
    async function loadEdition() {
      const message = document.getElementById("message");
      const list = document.getElementById("stories");

      try {
        const response = await fetch(
          "./approved-stories.json?updated=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) throw new Error("Edition file unavailable");

        const data = await response.json();

        document.getElementById("edition-title").textContent =
          data.edition || "Approved Edition";

        document.getElementById("edition-date").textContent =
          data.date ? "Edition date: " + data.date : "";

        if (data.status !== "approved") {
          message.textContent =
            "No approved edition is currently available. Stories remain unpublished until an editor explicitly approves them.";
          return;
        }

        if (!Array.isArray(data.stories) || data.stories.length === 0) {
          message.textContent =
            "The edition is marked approved, but it contains no stories. Please correct the file before publishing.";
          return;
        }

        const validStories = data.stories.filter(story =>
          story &&
          typeof story.title === "string" &&
          typeof story.summary === "string" &&
          typeof story.sourceUrl === "string" &&
          /^https?:\/\//i.test(story.sourceUrl)
        );

        if (validStories.length === 0) {
          message.textContent =
            "No valid stories were found. Check each story's title, summary and source link.";
          return;
        }

        message.textContent =
          "Editorial status: approved. " +
          validStories.length + " story/stories available.";

        validStories.forEach(story => {
          const article = document.createElement("article");
          article.className = "story";

          const heading = document.createElement("h2");
          heading.textContent = story.title;
          article.appendChild(heading);

          if (story.category) {
            const category = document.createElement("p");
            category.className = "edition";
            category.textContent = story.category;
            article.appendChild(category);
          }

          const summary = document.createElement("p");
          summary.textContent = story.summary;
          article.appendChild(summary);

          if (Array.isArray(story.paragraphs)) {
            story.paragraphs.forEach(text => {
              if (typeof text === "string") {
                const paragraph = document.createElement("p");
                paragraph.textContent = text;
                article.appendChild(paragraph);
              }
            });
          }

          const source = document.createElement("a");
          source.href = story.sourceUrl;
          source.target = "_blank";
          source.rel = "noopener noreferrer";
          source.textContent = "Read the original source";
          article.appendChild(source);

          list.appendChild(article);
        });

      } catch (error) {
        message.textContent =
          "The edition could not be loaded. Please try again later.";
      }
    }

    loadEdition();
  </script>
</body>
</html>
