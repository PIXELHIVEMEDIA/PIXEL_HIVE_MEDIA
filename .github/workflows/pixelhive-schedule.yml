YAML

name: PixelHive Daily Editions

on:
  schedule:
    # Kenya time (EAT, UTC+3)
    - cron: "7 2 * * *"
    - cron: "7 10 * * *"
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixelhive-daily-editions
  cancel-in-progress: false

jobs:
  collect-and-prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect news research leads
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/collect_news.py

      - name: Organize edition draft
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/organize_editions.py

      - name: Build approved website stories
        run: python scripts/build_published_stories.py

      - name: Commit generated story data
        run: |
          git config user.name "PixelHive News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scheduled-stories.js

          if git diff --cached --quiet; then
            echo "No generated story changes."
          else
            git commit -m "Update approved PixelHive story data"
            git push
          fi

      - name: Upload research and edition drafts
        uses: actions/upload-artifact@v6
        with:
          name: pixelhive-edition-drafts
          path: pixelhive-research/
          if-no-files-found: warn
          retention-days: 7
