
name: PixelHive Daily Editions

on:
  schedule:
    # Kenya time: 5:07 AM, 1:07 PM, 7:07 PM
    - cron: "7 2 * * *"
    - cron: "7 10 * * *"
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-news-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and screen news leads
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/collect_news.py

      - name: Save research queue
        uses: actions/upload-artifact@v4
        with:
          name: pixelhive-review-queue
          path: pixelhive-research/
          if-no-files-found: error
          retention-days: 7
